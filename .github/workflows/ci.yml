name: Checks Automatizados
on:
  pull_request:
    branches: [ "main" ]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar pytest e coverage
        run: pip install pytest pytest-cov
      - name: Rodar testes e exigir 80%% de cobertura
        run: pytest --cov=. --cov-fail-under=80
